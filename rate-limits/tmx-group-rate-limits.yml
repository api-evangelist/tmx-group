description: TMX Analytics Data Science APIs enforce monthly call limits per group
  per subscription plan (Free, Starter, Premium), plus symbol-coverage and lookback-day
  entitlement limits. Documented 403 responses signal exceeded daily/monthly/call
  limits and non-permitted symbols or lookback ranges; once the monthly plan limit
  is exhausted overage charges apply and the API does not throw an error, with usage
  notifications sent at 50%, 75%, and 100% of the monthly limit. No rate-limit
  response headers are documented. Bearer tokens expire after one hour.
sources:
  - https://docs.tmxanalytics.com/#subscription-plans-limits
  - https://docs.tmxanalytics.com/#errors
responseCodes:
