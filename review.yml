- url: https://docs.tmxanalytics.com/
  type: Documentation
  note: TMX Data Science API V1/V2 docs - endpoints, auth, plans, billing, S3 and notebook delivery, Excel/Sheets add-ins.
- url: https://hub.tmxanalytics.com/
  type: Portal
