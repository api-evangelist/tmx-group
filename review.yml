aid: tmx-group
name: TMX Group
review:
  question: Does TMX Group expose a public, documented API surface for its market data?
  answer: true
  date: '2026-07-21'
  reviewer: API Evangelist
findings:
  summary: |
    TMX Group's data arm, TMX Datalinx, runs a genuinely public developer
    surface for its analytics tier while keeping its real-time exchange
    feeds sales-gated. Public documentation lives at
    https://docs.tmxanalytics.com/ (HTTP 200), a Slate-style single-page
    portal for the "TMX Data Science API" in two generations: V1 on
    https://analyticsapi.tmxanalytics.com/v1 (POST-based; CA/US equity
    daily stats, intraday 1-min/1-sec trade and quote bars, TAQ NBBO tick
    data, broker analytics, MX options/futures daily stats, short
    interest, buybacks, price adjustment curves, MOC imbalance, issuers,
    global symbols) and V2 on https://insightapi.tmxanalytics.com/v2
    (GET-based; broker analytics, reference data plus CRV
    bulletins/entitlements/FITC/SMF and S&P/TSX index datasets). Both
    hosts are live: unauthenticated probes return HTTP 401, confirming a
    real, entitlement-gated API rather than marketing vapor. Auth is
    username/password plus an x-api-key from hub.tmxanalytics.com
    exchanged at POST /authn for a bearer token valid one hour.
    Onboarding is self-serve via hub.tmxanalytics.com (HTTP 200) with
    documented subscription plans, limits, and billing; datasets are also
    sold through the TMX Datalinx Webstore (tmxwebstore.com, HTTP 200,
    "Unified API" product category). No public OpenAPI/Swagger/AsyncAPI
    document is downloadable - the docs are generated HTML only - so no
    spec was harvested. Real-time feeds (TL1/TL2, QuantumFeed,
    PowerStream, MX Order Book Feed) are separate sales-gated broadcast
    products on tmxinfoservices.com, and the Montreal Exchange documents
    a FIX-based Trade Manager API for approved participants. Delivery
    beyond REST includes cloud/S3 flat-file distribution and Zeppelin
    notebook access, plus Excel and Google Sheets add-ins.
  posture:
    developerPortal: https://docs.tmxanalytics.com/
    selfServe: true
    selfServeScope: Analytics/historical REST APIs only; real-time feeds are sales-gated
    authentication: API key (hub.tmxanalytics.com) + POST /authn bearer token (1-hour expiry)
    pricingPublic: partial (subscription plans documented in docs; feed pricing via contract documents)
    openApiSpec: none published
    ownership: TMX Group Limited (TSX:X), Toronto - operates TSX, TSXV, TSX Alpha, Montreal Exchange; data brands include TMX Datalinx, TMX VettaFi, Wall Street Horizon, Trayport
  transports:
  - protocol: REST
    scheme: https
    baseURL: https://analyticsapi.tmxanalytics.com/v1
    documented: true
    probedStatus: 401
  - protocol: REST
    scheme: https
    baseURL: https://insightapi.tmxanalytics.com/v2
    documented: true
    probedStatus: 401
  - protocol: Multicast
    documented: true
    note: Real-time broadcast feeds (TL1/TL2, CL1/CL2, AL1/AL2, QuantumFeed, MX Order Book Feed) listed on tmxinfoservices.com; sales-gated, no public technical specs.
  - protocol: FIX
    documented: true
    note: Montreal Exchange Trade Manager FIX API for approved participants and clearing firms (m-x.ca market access pages).
  - protocol: FlatFiles
    documented: true
    note: Cloud/S3 delivery documented in TMX Analytics docs (AWS CLI, S3 via WinSCP) and Datalinx cloud delivery marketing.
  - protocol: WebSocket
    documented: false
    note: No public WebSocket or streaming API is documented on docs.tmxanalytics.com.
