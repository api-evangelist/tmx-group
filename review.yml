actions:
  openapiHarvested: false
  reason: |
    No machine-readable OpenAPI/Swagger/AsyncAPI artifact is publicly
    downloadable from docs.tmxanalytics.com or the TMXGroup GitHub
    organization; per no-fabrication policy nothing was authored. The
    endpoint inventory above was harvested from the rendered docs HTML.
