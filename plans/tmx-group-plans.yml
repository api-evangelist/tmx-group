description: TMX Analytics Data Science APIs are sold as per-group subscription plans
  (Free, Starter, Premium) with monthly call limits, symbol-coverage caps, and lookback
  windows applied per group per plan. Billing is monthly in arrears; overage charges
  apply once a plan's monthly call limit is exhausted, with notifications at 50%, 75%,
  and 100% of the limit (the API itself does not error on overage of the monthly plan
  limit). Signup is self-serve via hub.tmxanalytics.com; datasets are also sold through
  the TMX Datalinx Webstore.
sources:
  - https://docs.tmxanalytics.com/#subscription-plans-limits
  - https://docs.tmxanalytics.com/#billing
  - https://www.tmxwebstore.com/
