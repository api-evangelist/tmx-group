aid: tmx-group
url: https://raw.githubusercontent.com/api-evangelist/tmx-group/refs/heads/main/apis.yml
name: TMX Group
kind: company
description: TMX Group operates Canadian capital-markets infrastructure - Toronto
  Stock Exchange, TSX Venture Exchange, TSX Alpha, and the Montreal Exchange - and
  sells market data through its TMX Datalinx arm. Alongside sales-gated real-time
  broadcast feeds (TL1/TL2, QuantumFeed, MX Order Book Feed) it offers a self-serve
  TMX Analytics platform (hub.tmxanalytics.com) whose REST Data Science APIs deliver
  Canadian and US equity daily stats, intraday trade/quote bars, TAQ NBBO tick data,
  broker analytics, short interest, buybacks, corporate actions and reference data,
  and Montreal Exchange options and futures analytics, plus cloud/S3 flat-file and
  notebook delivery.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
