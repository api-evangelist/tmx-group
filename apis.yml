apis:
- aid: tmx-group:tmx-equity-analytics-api
  name: TMX Essential Analytics for Equities API
  tags:
  - Equities
  - Daily Stats
  - Liquidity
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.tmxanalytics.com/#prod-tmx-ds-api-essential-analytics-for-equities
  baseURL: https://analyticsapi.tmxanalytics.com/v1
  properties:
  - url: https://docs.tmxanalytics.com/#prod-tmx-ds-api-essential-analytics-for-equities
    type: Documentation
  description: End-of-day equity analytics for Canadian and US markets - basic, daily,
    and advanced daily stats plus liquidity analytics and liquidity summaries - via
    POST endpoints such as /v1/ca/dailystats, /v1/us/advanceddailystats, and
    /v1/ca/liquidityanalytics returning JSON (T-1 data by 6:30am ET).
